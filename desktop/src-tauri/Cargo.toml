[package]
name = "kotodama"
# Rust crate version: NOT the version shown by the app.
# The single source of truth is desktop/package.json (tauri.conf.json points to "../package.json").
# No need to bump it every release: just keep it valid for cargo.
version = "0.1.8"
description = "Kotodama • Ai Prompt Builder — Tauri desktop app"
authors = ["Michel-IT"]
edition = "2021"
rust-version = "1.77.2"

# The logic lives in the lib (`app_lib`) so it stays reusable on mobile too.
[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` -> multi-webview (window.add_child); `tray-icon`+`image-png` -> system tray;
# `macos-private-api` -> transparent toast window on macOS (required by macOSPrivateApi in tauri.conf.json)
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard = "2"          # clipboard monitor + read/write
tauri-plugin-global-shortcut = "2"    # global hotkey
tauri-plugin-autostart = "2"          # start on login
tauri-plugin-opener = "2"             # open links in the system browser + open the Downloads folder
tauri-plugin-notification = "2"       # native OS notification (e.g. provider file downloaded)
tauri-plugin-updater = "2"            # auto-update from the public Kotodama repo Releases
tauri-plugin-single-instance = "2"    # single instance: a 2nd launch focuses the existing one
sys-locale = "0.3"                    # OS language detection (multilingual first launch)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows only: move the window onto the CURRENT virtual desktop (IVirtualDesktopManager).
# The Tauri set_visible_on_all_workspaces API is a no-op on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",   # SendInput: inline transform (simulated Ctrl+C / Ctrl+V)
] }
# WebView2 COM interfaces (CookieManager, WebResourceResponseReceived) for provider login-state
# probing. `windows` bumped 0.60 -> 0.61 to MATCH webview2-com-sys's own pin (it requires exactly
# "0.61"): a mismatched minor version here resolves as two separate incompatible copies of
# windows-core/windows-strings in the dependency tree, so PWSTR from our code and PWSTR expected
# by webview2-com-sys's bindings are literally different types (verified: this broke compilation).
webview2-com = "0.38"

# macOS only: synthesize Cmd+C / Cmd+V for the inline transform via CGEvent (requires the app to
# have Accessibility permission), and the AXIsProcessTrusted prompt. Versions pinned to what the
# tauri/tao dependency tree already resolves, to avoid duplicate crate versions.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
# NSWindow: park the host window off-screen but VISIBLE (orderFrontRegardless) during the inline
# transform, so WKWebView is not throttled while the window is minimized (else the provider answer
# never streams). Versions match the tauri/objc2 tree.
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Faster `tauri dev` iteration (does not affect the release profile).
# debug="line-tables-only": drastically smaller debug binary -> much faster LINK (the debug-info/PDB
# is what makes the Windows debug link slow, and less for the antivirus to scan); keeps panic line numbers.
[profile.dev]
opt-level = 1
codegen-units = 16
debug = "line-tables-only"
