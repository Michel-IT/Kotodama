<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kotodama • Menu provider</title>
  <style>
    /* Floating provider menu, drawn over the provider webview WITHOUT hiding it.
       Theme colors arrive resolved from the main window (menu://data) so this stays
       in sync with the app theme without duplicating the theme definitions. */
    :root { --panel:#141414; --panel-2:#1e1e1e; --border:#2a2a2a; --text:#ededed; --accent:#ffb454; --shadow:0 16px 40px rgba(0,0,0,.5); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { background:transparent; overflow:hidden; width:100%; height:100%; }
    body { font-family:"Segoe UI", system-ui, -apple-system, sans-serif; -webkit-user-select:none; user-select:none; cursor:default; }
    /* the window is a full-monitor transparent backdrop; the box is positioned by JS at the ⇄ anchor */
    .pmenu { position:absolute; width:216px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:6px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:2px; animation:pop .12s ease-out; }
    @keyframes pop { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
    .pm-row { position:relative; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--text); }
    .pm-row:hover { background:var(--panel-2); }
    .pm-ico { width:22px; height:22px; display:grid; place-items:center; flex:none; color:var(--accent); }
    .pm-ico svg { display:block; }
    .pm-name { flex:1; font-size:13px; font-weight:600; white-space:nowrap; }
    .pm-arrow { opacity:.45; font-size:11px; flex:none; }
    .pm-sep { height:1px; background:var(--border); margin:5px 4px; }
    .pm-sub { position:absolute; top:-6px; left:100%; margin-left:2px; min-width:172px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:5px; box-shadow:var(--shadow); flex-direction:column; gap:2px; display:none; }
    .pm-sub.flip { left:auto; right:100%; margin-left:0; margin-right:2px; }
    .pm-row:hover > .pm-sub, .pm-sub:hover { display:flex; }
    .pm-act { text-align:left; background:none; border:none; color:var(--text); padding:8px 12px; border-radius:6px; cursor:pointer; font:inherit; font-size:13px; white-space:nowrap; }
    .pm-act:hover { background:var(--panel-2); color:var(--accent); }
  </style>
</head>
<body>
  <div class="pmenu" id="pmenu"></div>
  <script>
    document.addEventListener('contextmenu', e=>e.preventDefault());
    const T = window.__TAURI__;
    const invoke = (T && T.core) ? T.core.invoke : null;
    const listen = (T && T.event) ? T.event.listen : null;
    const pmenu = document.getElementById('pmenu');
    let armed = false;   // ignore the transient blur right after show
    const mlog = (m)=>{ try{ if(invoke) invoke('menu_log',{msg:m}); }catch(e){} };
    mlog('loaded; invoke='+(!!invoke)+' listen='+(!!listen));

    function applyTheme(th){ if(!th) return; const r=document.documentElement.style;
      const set=(k,v)=>{ if(v) r.setProperty(k,v); };
      set('--panel',th.panel); set('--panel-2',th.panel2); set('--border',th.border);
      set('--text',th.text); set('--accent',th.accent); set('--shadow',th.shadow);
    }
    function dismiss(){ if(invoke) invoke('menu_dismiss').catch(()=>{}); }
    function pick(key,mode){ if(invoke) invoke('menu_pick',{key,mode}).catch(()=>{}); }
    function openDownloads(){ if(invoke) invoke('menu_downloads').catch(()=>{}); }

    function build(data){
      const labels=data.labels||{}, provs=data.providers||[];
      pmenu.innerHTML='';
      // "Gestore download"
      const dl=document.createElement('div'); dl.className='pm-row';
      const di=document.createElement('span'); di.className='pm-ico'; di.textContent='⤓';
      const dn=document.createElement('span'); dn.className='pm-name'; dn.textContent=labels.downloads||'Download manager';
      dl.append(di,dn); dl.addEventListener('click', openDownloads);
      pmenu.appendChild(dl);
      const sep=document.createElement('div'); sep.className='pm-sep'; pmenu.appendChild(sep);
      // providers, each with icon + flyout (Apri / Apri+incolla / Apri+incolla+invia)
      provs.forEach(p=>{
        const row=document.createElement('div'); row.className='pm-row';
        const ico=document.createElement('span'); ico.className='pm-ico';
        if(p.svg){ ico.innerHTML=p.svg; if(p.color) ico.style.color=p.color; } else ico.textContent='✦';
        const name=document.createElement('span'); name.className='pm-name'; name.textContent=p.name;
        const arrow=document.createElement('span'); arrow.className='pm-arrow'; arrow.textContent='▸';
        const sub=document.createElement('div'); sub.className='pm-sub';
        [ {label:labels.openOnly||'Open',            mode:'open'},
          {label:labels.openAndPaste||'Open + paste', mode:'paste'},
          {label:labels.openAndSend||'Open + paste + send', mode:'send'} ].forEach(a=>{
          const b=document.createElement('button'); b.type='button'; b.className='pm-act'; b.textContent=a.label;
          b.addEventListener('click', ev=>{ ev.stopPropagation(); pick(p.key,a.mode); });
          sub.appendChild(b);
        });
        row.append(ico,name,arrow,sub);
        // flyout opens right; flip left only if it would overflow the window's right edge
        row.addEventListener('mouseenter', ()=>{ const rb=row.getBoundingClientRect(); sub.classList.toggle('flip', rb.right+190 > window.innerWidth-6); });
        row.addEventListener('click', ev=>{ if(ev.target.closest('.pm-sub')) return; pick(p.key,'send'); });
        pmenu.appendChild(row);
      });
      // place the box at the ⇄ anchor (right-aligned to the button, just below), clamped to the monitor
      const aw=pmenu.offsetWidth, ah=pmenu.offsetHeight;
      const ax=(typeof data.anchorX==='number')?data.anchorX:6, ay=(typeof data.anchorY==='number')?data.anchorY:6;
      pmenu.style.left=Math.max(6, Math.min(ax-aw, window.innerWidth-aw-6))+'px';
      pmenu.style.top =Math.max(6, Math.min(ay, window.innerHeight-ah-6))+'px';
    }

    if(listen){
      listen('menu://data', e=>{
        const d=e.payload||{}; mlog('data: '+((d.providers||[]).length)+' providers'); applyTheme(d.theme); build(d);
        armed=false; setTimeout(()=>{ armed=true; }, 260);
      });
    }
    // dismiss: focus lost (click elsewhere), click on the transparent area, or Escape
    window.addEventListener('blur', ()=>{ if(armed) dismiss(); });
    document.addEventListener('mousedown', e=>{ if(!e.target.closest('.pmenu')) dismiss(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') dismiss(); });
  </script>
</body>
</html>
